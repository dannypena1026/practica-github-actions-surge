name: Despliegue continuo a Surge.sh

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Publicar pagina web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar archivos para publicar
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Instalar Surge
        run: npm install --global surge

      - name: Desplegar automaticamente
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo 'Falta configurar el secret SURGE_TOKEN en GitHub.'
            exit 1
          fi
          surge ./dist dannypena1026-2025-1124-ci.surge.sh
